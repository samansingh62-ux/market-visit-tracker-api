name: Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    # 24.04 images ship with the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check for the Android SDK
        id: sdk
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<missing>}"
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/platforms" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install the Android SDK (only if the image lacks it)
        if: steps.sdk.outputs.present != 'true'
        uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use the stable signing key (if added as a repo secret)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MarketVisit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MarketVisit-apk
          path: MarketVisit.apk

      - name: Publish as the "android-latest" download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest MarketVisit.apk \
            --target "$GITHUB_SHA" \
            --title "Market Visit Android app (build ${{ github.run_number }})" \
            --notes "Latest Market Visit app for Android. Download MarketVisit.apk on the phone, open it, and allow installing from this source when asked. Screens update from the server automatically; a new APK is only needed when this build changes."
