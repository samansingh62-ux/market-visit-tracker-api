name: WhatsApp MCP tests
on:
  push:
    branches: [codex/whatsapp-mcp]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt 'pytest>=8,<9'
      - run: PYTHONPATH=. python -m pytest tests -q
