services:
  - type: web
    name: market-visit-tracker-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VWORK_LIVE_API_URL
        sync: false
      - key: VWORK_LIVE_API_KEY
        sync: false
